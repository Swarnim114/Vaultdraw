[package]
name = "excalidraw-vault"
version = "0.1.0"
description = "Offline Excalidraw local vault desktop app"
authors = ["Excalidraw"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "excalidraw_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
notify = "6"
toml = "1"
toml_edit = "0.25"
rfd = "0.15"
trash = "5"
memchr = "2"
unicode-normalization = "0.1"
postcard = { version = "1", features = ["use-std"] }
crc32fast = "1"
# File history (PLAN D-Z): level-3 frames, no default features (no legacy formats, no zdict builder).
zstd = { version = "0.13", default-features = false, features = ["thin"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
smoke-test = []

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-web-kit = { version = "0.3", features = ["WKWebViewConfiguration", "WKPreferences", "WKWebsiteDataStore"] }

# Hardware SHA-256 on Apple Silicon / ARM (about 4x faster revision hashing of large drawings).
[target.'cfg(all(target_arch = "aarch64", target_vendor = "apple"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }
