[package]
name = "excalidraw-vault"
version = "0.1.0"
description = "Offline Excalidraw local vault desktop app"
authors = ["Excalidraw"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "excalidraw_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
notify = "6"
rfd = "0.15"
trash = "5"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
smoke-test = []
